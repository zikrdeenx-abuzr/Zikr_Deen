      - name: Build debug APK
        run: cd "$PROJECT/android" && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify permissions, Azan audio & Firebase inside the built APK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT=$(ls -1 "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT" ] || [ ! -x "$AAPT" ]; then
            echo "ERROR: aapt2 not found under Android SDK ($SDK)"
            exit 1
          fi
          APK="$PROJECT/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "ERROR: APK not found at $APK"; exit 1; }
          OUT="$("$AAPT" dump permissions "$APK")"
          echo "$OUT"
          for REQ in INTERNET CAMERA RECORD_AUDIO MODIFY_AUDIO_SETTINGS ACCESS_FINE_LOCATION POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM WAKE_LOCK FOREGROUND_SERVICE RECEIVE_BOOT_COMPLETED; do
            echo "$OUT" | grep -q "$REQ" || { echo "ERROR: $REQ permission is NOT inside the APK"; exit 1; }
          done
          unzip -l "$APK" | grep -q "res/raw/azan" || { echo "ERROR: res/raw/azan audio is NOT inside the APK"; exit 1; }
          echo "Native Azan audio and all alarm permissions verified inside APK"
          if [ "$FIREBASE" = "on" ]; then
            if "$AAPT" dump resources "$APK" | grep -q "default_web_client_id"; then
              echo "Firebase Google login config is inside the APK"
            else
              echo "::warning::default_web_client_id missing in the APK - Google login will NOT work. Re-download google-services.json after adding SHA-1 and enabling Google sign-in."
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zikr-Deen-v47-debug-APK
          path: ${{ env.PROJECT }}/android/app/build/outputs/apk/debug/app-debug.apk
