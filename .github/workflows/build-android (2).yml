            "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"
          ];
          const toAdd = [];
          for (const p of perms) {
            if (!xml.includes("android.permission." + p)) {
              toAdd.push(`    <uses-permission android:name="android.permission.${p}" />`);
            }
          }
          if (toAdd.length) {
            const rx = /^([ \t]*<application\b)/m;
            if (!rx.test(xml)) {
              console.error("ERROR: <application> tag not found in AndroidManifest.xml");
              process.exit(1);
            }
            xml = xml.replace(rx, toAdd.join("\n") + "\n$1");
          }

          if (!xml.includes("AzanAlarmReceiver")) {
