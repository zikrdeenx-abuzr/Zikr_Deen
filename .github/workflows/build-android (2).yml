            }
            if (/super\.onCreate\s*\(/.test(mainAct)) {
              mainAct = mainAct.replace(/super\.onCreate\s*\(/, "registerPlugin(AzanAlarmPlugin.class);\n        super.onCreate(");
            } else {
              const lastBrace = mainAct.lastIndexOf("}");
              if (lastBrace === -1) {
                console.error("ERROR: Invalid MainActivity.java structure");
                process.exit(1);
              }
              const method = "\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(AzanAlarmPlugin.class);\n        super.onCreate(savedInstanceState);\n    }\n";
              mainAct = mainAct.slice(0, lastBrace) + method + mainAct.slice(lastBrace);
