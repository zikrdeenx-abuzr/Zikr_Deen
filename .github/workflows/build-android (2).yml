          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONArray;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "AzanAlarm")
          public class AzanAlarmPlugin extends Plugin {

              @PluginMethod
              public void schedule(PluginCall call) {
                  Context ctx = getContext();
                  AzanAlarmReceiver.cancelAll(ctx);
                  JSArray arr = call.getArray("alarms");
                  JSONArray saved = new JSONArray();
                  int count = 0;
                  long now = System.currentTimeMillis();
                  if (arr != null) {
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject o = arr.optJSONObject(i);
                          if (o == null) continue;
                          int id = o.optInt("id", i + 1);
                          long timeMs = o.optLong("timeMs", 0L);
                          if (timeMs <= now + 1000L) continue;
                          String title = o.optString("title", "Namaz ka waqt ho gaya");
                          String body = o.optString("body", "Zikr Deen");
                          boolean azan = o.optBoolean("azan", true);
                          AzanAlarmReceiver.scheduleOne(ctx, id, timeMs, title, body, azan);
                          saved.put(o);
                          count++;
                      }
                  }
                  SharedPreferences sp = ctx.getSharedPreferences(AzanAlarmReceiver.PREFS, Context.MODE_PRIVATE);
                  sp.edit().putString(AzanAlarmReceiver.KEY_LIST, saved.toString()).apply();

                  JSObject ret = new JSObject();
                  ret.put("scheduled", count);
                  ret.put("exactAllowed", AzanAlarmReceiver.canScheduleExact(ctx));
                  call.resolve(ret);
              }

              @PluginMethod
              public void cancelAll(PluginCall call) {
                  AzanAlarmReceiver.cancelAll(getContext());
                  JSObject ret = new JSObject();
                  ret.put("cancelled", true);
                  call.resolve(ret);
              }

              @PluginMethod
              public void stopAzan(PluginCall call) {
                  Context ctx = getContext();
                  try {
                      ctx.stopService(new Intent(ctx, AzanPlaybackService.class));
                  } catch (Exception ignored) {
                  }
                  NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.cancel(AzanPlaybackService.NOTIF_ID);
                  JSObject ret = new JSObject();
                  ret.put("stopped", true);
                  call.resolve(ret);
              }

              @PluginMethod
              public void testAlarm(PluginCall call) {
                  Context ctx = getContext();
                  Integer delayObj = call.getInt("delayMs", 10000);
                  long delayMs = delayObj != null ? Math.max(2000L, delayObj.longValue()) : 10000L;
                  Boolean azanObj = call.getBoolean("azan", true);
                  boolean azan = azanObj == null || azanObj;
                  String title = call.getString("title", "Test: Azan Alarm");
                  String body = call.getString("body", "Phone sleep mode par bhi azan bajegi");
                  long triggerAt = System.currentTimeMillis() + delayMs;
                  AzanAlarmReceiver.scheduleOne(ctx, 9999, triggerAt, title, body, azan);

                  JSObject ret = new JSObject();
                  ret.put("scheduled", true);
                  ret.put("triggerAt", triggerAt);
                  ret.put("exactAllowed", AzanAlarmReceiver.canScheduleExact(ctx));
                  call.resolve(ret);
              }

              @PluginMethod
              public void checkStatus(PluginCall call) {
                  Context ctx = getContext();
                  String pkgName = ctx.getPackageName();
                  boolean exact = AzanAlarmReceiver.canScheduleExact(ctx);
                  boolean batteryIgnored = true;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PowerManager pm = (PowerManager) ctx.getSystemService(Context.POWER_SERVICE);
                      batteryIgnored = pm != null && pm.isIgnoringBatteryOptimizations(pkgName);
                  }
                  boolean hasAudio = ctx.getResources().getIdentifier("azan", "raw", pkgName) != 0;

                  JSObject ret = new JSObject();
                  ret.put("exactAllowed", exact);
                  ret.put("batteryIgnored", batteryIgnored);
                  ret.put("hasAzanAudio", hasAudio);
                  ret.put("playing", AzanPlaybackService.isPlaying());
                  call.resolve(ret);
              }

              @PluginMethod
              public void openExactAlarmSettings(PluginCall call) {
                  Context ctx = getContext();
                  try {
                      Intent i = new Intent("android.settings.REQUEST_SCHEDULE_EXACT_ALARM", Uri.parse("package:" + ctx.getPackageName()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      ctx.startActivity(i);
                  } catch (Exception e) {
                      openAppDetails(ctx);
                  }
                  call.resolve();
              }

              @PluginMethod
              public void openBatterySettings(PluginCall call) {
                  Context ctx = getContext();
                  try {
                      Intent i = new Intent("android.settings.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS", Uri.parse("package:" + ctx.getPackageName()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      ctx.startActivity(i);
                  } catch (Exception e) {
                      try {
                          Intent i2 = new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS);
                          i2.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(i2);
                      } catch (Exception e2) {
                          openAppDetails(ctx);
                      }
                  }
                  call.resolve();
              }

              private void openAppDetails(Context ctx) {
                  try {
                      Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + ctx.getPackageName()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      ctx.startActivity(i);
                  } catch (Exception ignored) {
                  }
              }
          }
          `;

          fs.writeFileSync(path.join(azanDir, "AzanPlaybackService.java"), serviceJava);
