name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          mkdir -p build_src
          unzip -o -q "$(ls *.zip | head -1)" -d build_src
          CFG=$(find build_src -name capacitor.config.json -not -path '*/node_modules/*' | head -1)
          echo "PROJECT=$(dirname "$CFG")" >> $GITHUB_ENV

      - name: Setup project
        run: cd "$PROJECT" && node scripts/setup.js

      - name: Build debug APK
        run: cd "$PROJECT/android" && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zikr-Deen-APK
          path: ${{ env.PROJECT }}/android/app/build/outputs/apk/debug/app-debug.apk
