name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project
        run: unzip -q ./*.zip
      - name: Setup
        working-directory: Zikr_Deen_Android
        run: node scripts/setup.js
      - name: Build APK
        working-directory: Zikr_Deen_Android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Zikr_Deen_Android/android/app/build/outputs/apk/debug/app-debug.apk ZikrDeen.apk
          gh release create "apk-${{ github.run_number }}" ZikrDeen.apk --title "Zikr Deen APK ${{ github.run_number }}" --notes "Phone par install karein"
