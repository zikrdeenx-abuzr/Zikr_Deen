name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          mkdir -p build_src
          MAIN="$(ls *.zip | grep -v '^zd-patch' | head -1)"
          unzip -o -q "$MAIN" -d build_src
          CFG=$(find build_src -name capacitor.config.json -not -path '*/node_modules/*' | head -1)
          echo "PROJECT=$(dirname "$CFG")" >> $GITHUB_ENV

      - name: Apply patch (new logo, intro, Ask AI fix)
        run: |
          if [ -f zd-patch.zip ]; then
            mkdir -p patch_src
            unzip -o -q zd-patch.zip -d patch_src
            cp -r patch_src/www/. "$PROJECT/www/"
            echo "Patch applied to www"
          else
            echo "No zd-patch.zip found - skipping patch"
          fi

      - name: Add Gemini key (Ask Zikr Deen)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            sed -i "s|__GEMINI_API_KEY__|$GEMINI_API_KEY|" "$PROJECT/www/js/ask-config.js"
            echo "Gemini key added"
          else
            echo "WARNING: GEMINI_API_KEY secret not set - AI chat will show 'not set up'"
          fi

      - name: Setup project
        run: cd "$PROJECT" && node scripts/setup.js

      - name: Apply Android launcher icons
        run: |
          RES="$PROJECT/android/app/src/main/res"
          if [ -d patch_src/android-res ] && [ -d "$RES" ]; then
            cp -r patch_src/android-res/. "$RES/"
            echo "Launcher icons replaced"
          else
            echo "Icon patch skipped"
          fi

      - name: Build debug APK
        run: cd "$PROJECT/android" && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zikr-Deen-APK
          path: ${{ env.PROJECT }}/android/app/build/outputs/apk/debug/app-debug.apk
