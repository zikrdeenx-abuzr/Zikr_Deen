name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          # newest uploaded zip wins (project zip and patch zip are picked separately, by upload/commit time)
          MAIN="$(ls *.zip | grep -v '^zd-patch' | while read -r f; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)"
          PATCH="$(ls zd-patch*.zip 2>/dev/null | while read -r f; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)"
          echo "Project zip: $MAIN"
          echo "Patch zip:   ${PATCH:-none}"
          mkdir -p build_src
          unzip -o -q "$MAIN" -d build_src
          CFG=$(find build_src -name capacitor.config.json -not -path '*/node_modules/*' | head -1)
          echo "PROJECT=$(dirname "$CFG")" >> $GITHUB_ENV
          echo "PATCH_ZIP=$PATCH" >> $GITHUB_ENV

      - name: Apply patch (new logo, intro, Ask AI, Qibla)
        run: |
          if [ -n "$PATCH_ZIP" ] && [ -f "$PATCH_ZIP" ]; then
            mkdir -p patch_src
            unzip -o -q "$PATCH_ZIP" -d patch_src
            cp -r patch_src/www/. "$PROJECT/www/"
            echo "Patch applied to www: $PATCH_ZIP"
            grep -q "qibla.js" "$PROJECT/www/index.html" || { echo "ERROR: Qibla not linked in index.html"; exit 1; }
            ls "$PROJECT/www/js/qibla.js" >/dev/null || { echo "ERROR: qibla.js missing"; exit 1; }
          else
            echo "No zd-patch zip found - skipping patch"
          fi

      - name: Add Gemini key (Ask Zikr Deen)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            sed -i "s|__GEMINI_API_KEY__|$GEMINI_API_KEY|" "$PROJECT/www/js/ask-config.js"
            echo "Gemini key added"
          else
            echo "WARNING: GEMINI_API_KEY secret not set - AI chat will show 'not set up'"
          fi

      - name: Setup project
        run: cd "$PROJECT" && node scripts/setup.js

      - name: Apply Android launcher icons
        run: |
          RES="$PROJECT/android/app/src/main/res"
          if [ -d patch_src/android-res ] && [ -d "$RES" ]; then
            cp -r patch_src/android-res/. "$RES/"
            echo "Launcher icons replaced"
          else
            echo "Icon patch skipped"
          fi

      # IMPORTANT: this step must run BEFORE "Build debug APK", otherwise the APK is already built without the permission.
      - name: Add Android permissions (microphone, location)
        run: |
          MF="$PROJECT/android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MF" ]; then echo "ERROR: AndroidManifest.xml not found"; exit 1; fi
          for P in RECORD_AUDIO MODIFY_AUDIO_SETTINGS ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION; do
            grep -q "android.permission.$P" "$MF" || sed -i "s|<application|<uses-permission android:name=\"android.permission.$P\" />\n    <application|" "$MF"
          done
          echo "--- permissions in manifest ---"
          grep -n "uses-permission" "$MF"
          grep -q "android.permission.RECORD_AUDIO" "$MF" || { echo "ERROR: RECORD_AUDIO missing"; exit 1; }

      - name: Build debug APK
        run: cd "$PROJECT/android" && chmod +x gradlew && ./gradlew assembleDebug

      - name: Show permissions inside the built APK
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 2>/dev/null | tail -1)
          OUT="$("$AAPT" dump permissions "$PROJECT/android/app/build/outputs/apk/debug/app-debug.apk")"
          echo "$OUT"
          echo "$OUT" | grep -q "RECORD_AUDIO" || { echo "ERROR: mic permission is NOT inside the APK"; exit 1; }
          echo "$OUT" | grep -q "ACCESS_FINE_LOCATION" || { echo "ERROR: location permission is NOT inside the APK"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zikr-Deen-APK
          path: ${{ env.PROJECT }}/android/app/build/outputs/apk/debug/app-debug.apk
