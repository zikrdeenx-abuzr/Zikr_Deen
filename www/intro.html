<script>
/* Zikr Deen intro v3 — Milky Way + rotating 3D Earth. Stays on screen until the viewer swipes up (no auto-advance). */
(()=>{
 const root=document.getElementById('zd-cosmic-intro'),canvas=document.getElementById('zd-cosmic-canvas'),btn=document.getElementById('zd-cosmic-skip');
 if(!root)return;
 const TAU=Math.PI*2,MIN_STAY=4500;
 let leaving=false,ready=false,started=false,raf=0,w=0,h=0,dpr=1,t0=0,bot=0;
 const reduced=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
 const small=Math.min(window.innerWidth,window.innerHeight)<700;
 try{history.scrollRestoration='manual'}catch(e){}
 const fallbackOut=()=>{try{cancelAnimationFrame(raf)}catch(e){}root.remove()};
 try{
 const ctx=canvas.getContext('2d');if(!ctx){fallbackOut();return}

 /* ================= leave: ONLY on the viewer's own gesture ================= */
 function removeNow(){cancelAnimationFrame(raf);root.remove();try{scrollTo(0,0)}catch(e){}}
 function leave(){
  if(leaving||!ready)return;leaving=true;root.classList.add('zd-leaving');
  root.style.transition='transform .85s cubic-bezier(.22,.8,.24,1)';
  root.style.transform='translate3d(0,-102%,0)';
  let fin=false;const end=()=>{if(fin)return;fin=true;removeNow()};
  root.addEventListener('transitionend',e=>{if(e.target===root)end()});setTimeout(end,1100)};
 let drag=false,sy=0,dy=0,st=0;
 root.addEventListener('pointerdown',e=>{if(!ready||leaving||e.target.closest('button'))return;drag=true;sy=e.clientY;dy=0;st=performance.now();root.style.transition='none';try{root.setPointerCapture(e.pointerId)}catch(_){}});
 root.addEventListener('pointermove',e=>{if(!drag)return;dy=Math.max(0,sy-e.clientY);root.style.transform='translate3d(0,'+(-dy)+'px,0)'});
 const up=()=>{if(!drag)return;drag=false;const v=dy/Math.max(1,performance.now()-st);
  if(dy>Math.min(90,h*.12)||(v>.45&&dy>24))leave();
  else{root.style.transition='transform .35s ease';root.style.transform='translate3d(0,0,0)'}};
 root.addEventListener('pointerup',up);root.addEventListener('pointercancel',up);
 root.addEventListener('wheel',e=>{e.preventDefault();if(ready&&e.deltaY>6)leave()},{passive:false});

 const hs=(x,y,z,s)=>{let k=Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(z,1274126177)^Math.imul(s,2246822519);k=Math.imul(k^(k>>>13),1274126177);k^=k>>>16;return(k>>>0)/4294967295};
 const sm=t=>t*t*(3-2*t);

   ctx.globalCompositeOperation='lighter';const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,8);sg.addColorStop(0,'rgba(255,250,220,1)');sg.addColorStop(1,'rgba(255,200,90,0)');ctx.fillStyle=sg;ctx.fillRect(sx-8,sy-8,16,16);
   ctx.restore()}
  frame++;if(!still&&frame%20===0&&!leaving)geom();
  if(!still)raf=requestAnimationFrame(draw)}

 /* ================= start (after the Arabic font is ready, so "الله" never flashes in a fallback font) ================= */
 function go(){if(started)return;started=true;layout();root.classList.add('zd-go');t0=performance.now();lastT=t0;
